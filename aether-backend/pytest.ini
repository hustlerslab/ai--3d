[pytest]
markers =
    blender: needs a real Blender executable (BLENDER_PATH)
    mock: class=MOCK - structural; no provider key, no vendor network, no GPU (every commit)
    real_provider: class=REAL-PROVIDER - one live call per provider, cost-capped (nightly)
    production_path: class=PRODUCTION-PATH - the real render path, Blender and GPU (pre-release)
testpaths = tests
