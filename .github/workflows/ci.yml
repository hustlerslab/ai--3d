# Allure CI — P0-INFRA-001
#
# Runs on every push and every pull request; a failure blocks the merge.
#
# The one thing this pipeline must never do is spend money or reach a real
# provider. That is not left to the test suite's good manners: every provider
# key is set to an empty string here, and a step asserts it before pytest runs.
# A CI job that quietly acquired a MESHY_API_KEY would burn credits on every
# commit, and nobody would notice until the invoice.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (class=MOCK)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # ── The test class, made explicit ────────────────────────────────
      # MOCK means: no provider key, no Blender, no vendor network. It is a
      # STRUCTURAL suite. It proves the code holds together; it does not prove
      # Gemini returns what we expect, and it must never be reported as though
      # it did (TRD.md TR-QA-001).
      ALLURE_TEST_CLASS: MOCK
      GEMINI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      MESHY_API_KEY: ""
      BLENDER_PATH: ""
      SCENE_IMAGE_ENABLED: "false"
      INTELLIGENCE_PROVIDER: "mock"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aether-backend/requirements.txt

      - name: Install dependencies
        working-directory: aether-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Assert this run cannot spend money
        working-directory: aether-backend
        run: |
          echo "::group::test class"
          echo "class=${ALLURE_TEST_CLASS}"
          echo "::endgroup::"
          python - <<'PY'
          import os, sys
          # The check is on the VALUE, not on presence: "unset" would pass here
          # and still be a real key in some other environment.
          leaked = [k for k in ("GEMINI_API_KEY", "ANTHROPIC_API_KEY", "MESHY_API_KEY")
                    if os.environ.get(k, "")]
          if leaked:
              sys.exit(f"REFUSING TO RUN: {', '.join(leaked)} is set. "
                       "CI must not reach a real provider or spend credits.")
          print("class=MOCK: no provider key is set; this run cannot spend a credit.")
          PY

      - name: Run the MOCK suite
        working-directory: aether-backend
        run: |
          echo "::notice title=Test class::class=MOCK - structural suite, zero real provider calls"
          python -m pytest -q --tb=short --junitxml=pytest-results.xml | tee pytest-output.txt

      - name: Label the result
        if: always()
        working-directory: aether-backend
        run: |
          line="$(grep -E '[0-9]+ (passed|failed)' pytest-output.txt | tail -n 1 || true)"
          echo "::notice title=class=MOCK::${line:-no summary line}"
          {
            echo "### class=MOCK — ${line:-no summary line}"
            echo ""
            echo "A MOCK run proves the code holds together. It does **not** prove any"
            echo "vendor integration works: no provider key is set for this job."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-class-MOCK
          path: |
            aether-backend/pytest-output.txt
            aether-backend/pytest-results.xml
          retention-days: 14

  frontend:
    name: Frontend (typecheck + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: aether-frontend/package-lock.json
      - name: Install
        working-directory: aether-frontend
        run: npm ci
      - name: Typecheck
        working-directory: aether-frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: aether-frontend
        run: npx next lint

  image:
    name: Container builds and serves /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t allure-backend:ci -f Dockerfile .

      - name: Boot it and ask whether it is alive
        run: |
          docker run -d --name allure-ci -p 8000:8000 \
            -e INTELLIGENCE_PROVIDER=mock \
            -e GEMINI_API_KEY= -e ANTHROPIC_API_KEY= -e MESHY_API_KEY= \
            allure-backend:ci
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health || true)"
            if [ "$code" = "200" ]; then echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "the container never served /api/health:"
          docker logs allure-ci
          exit 1

      - name: Confirm it is NOT world-open
        run: |
          # The image must ship with P0-SEC-002 in force. A container that
          # answers /api/projects anonymously was built from code that lost
          # its gate, and that is worth failing a build over.
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/projects)"
          echo "GET /api/projects (anonymous) -> $code"
          if [ "$code" != "401" ]; then echo "expected 401"; docker logs allure-ci; exit 1; fi

      - name: Container logs
        if: always()
        run: docker logs allure-ci || true
