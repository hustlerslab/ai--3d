# Allure backend — P0-INFRA-001
#
#   docker compose up --build
#   curl http://localhost:8000/api/health
#
# One service on purpose. Adding Postgres, Redis and a render worker because a
# production deployment will eventually want them would mean every developer
# runs four containers to exercise one — and none of those pieces exists yet
# (AUTH_PLAN.md steps 6–7 are explicitly deferred). This file grows when the
# code does.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: allure-backend:local
    ports:
      - "8000:8000"

    # Secrets come from the operator's .env at RUN time. Nothing here and
    # nothing in the image contains a key; `.dockerignore` keeps .env out of
    # the build context entirely.
    env_file:
      - path: ./aether-backend/.env
        required: false

    environment:
      AETHER_DATA_DIR: /app/data
      AETHER_CORS_ORIGINS: "http://localhost:3000,http://localhost:3001"

      # P0-AI-001: explicit, never `auto`. On `auto` the reasoning model is
      # chosen by whichever API key happens to be present, so adding a key to
      # .env would silently change the model that reads customers' homes.
      INTELLIGENCE_PROVIDER: "${INTELLIGENCE_PROVIDER:-gemini}"

      # P0-SEC-003. The image ships with caps on; raising them is a deliberate
      # edit here, not a default nobody noticed.
      MESHY_MAX_CREDITS_PER_PROJECT: "${MESHY_MAX_CREDITS_PER_PROJECT:-600}"
      MESHY_MAX_CREDITS_PER_USER: "${MESHY_MAX_CREDITS_PER_USER:-3000}"

      # P0-SEC-006. In-process, so this is correct for ONE replica. Running a
      # second would give each its own allowance — which reads as protection
      # and is not. Scale out only after the limiter has a shared store.
      RATE_LIMIT_ENABLED: "true"

      # Blender lives on the host, not in the image (see Dockerfile). Empty is
      # a supported state: render jobs fail with a clear message instead of
      # pretending to work.
      BLENDER_PATH: "${BLENDER_PATH:-}"

    volumes:
      # The database and every project artifact. Without this, a container
      # restart loses customers' uploads and renders.
      - ./aether-backend/data:/app/data

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    restart: unless-stopped

# ── After the first `up`, before exposing this host ──────────────────────
#
# P0-SEC-002 gives the FIRST account created on an instance administrator
# rights, so it can adopt projects that predate the users table. On a laptop
# that first account is the operator. On a reachable host it is a race.
#
#   curl -X POST http://localhost:8000/api/auth/register \
#        -H 'Content-Type: application/json' \
#        -d '{"email":"you@example.com","password":"<a real one>"}'
#
# Do that before the port is reachable by anyone else.
